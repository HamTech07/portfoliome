services:
  - type: web
    name: hamdan-portfolio-assistant
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: MAX_DAILY_REQUESTS
        value: 200
      - key: ALLOWED_ORIGINS
        sync: false
